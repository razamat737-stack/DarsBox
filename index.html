<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DarsBox — Ta'lim CRM</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DarsBox">
  <link rel="icon" type="image/png" sizes="192x192" href="./192.ikon.png">
  <link rel="apple-touch-icon" href="./192.ikon.png">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f8fafc;
      z-index: 10;
      transition: opacity 0.25s ease;
    }
    #loader img {
      width: 72px;
      height: 72px;
      object-fit: contain;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #appFrame {
      width: 100%;
      height: 100dvh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="loader">
    <img src="./192.ikon.png" alt="DarsBox">
    <div class="spinner"></div>
  </div>

  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzj6mFTTbTyiCvlJi-UrpjTRXyUKweMHj_fSJiOVkhb85Y0rVdyUNdP9i1etC9IfPF9Zw/exec"
    allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>

  <script>
    var loaderEl = document.getElementById('loader');
    var frameEl = document.getElementById('appFrame');

    function hideLoader() {
      if (!loaderEl) return;
      loaderEl.style.opacity = '0';
      setTimeout(function() { loaderEl.style.display = 'none'; }, 260);
    }

    function showLoader() {
      if (!loaderEl) return;
      loaderEl.style.display = 'flex';
      loaderEl.style.opacity = '1';
    }

    frameEl.addEventListener('load', hideLoader);

    // ASOSIY Google Sheets dan boshqa CRM havolasi kelganda shu iframe ichida ochadi
    window.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'DARSBOX_NAVIGATE' && typeof e.data.url === 'string') {
        if (e.data.url.indexOf('https://script.google.com/') === 0) {
          if (e.source) {
            try { e.source.postMessage({ type: 'DARSBOX_NAV_OK' }, '*'); } catch (err) {}
          }
          showLoader();
          frameEl.src = e.data.url;
        }
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
